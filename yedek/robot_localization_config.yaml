### Navsat Transform Node - GPS'i UTM'ye çevirir ###
navsat_transform_node:
  ros__parameters:
    frequency: 30.0
    delay: 3.0  # İlk GPS sinyali için bekleme süresi
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: false
    broadcast_utm_transform: false
    broadcast_utm_transform_as_parent_frame: false
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false
    
    # Datum ayarları (otomatik olarak ilk GPS noktasını kullanır)
    datum: [42.3582786739529, -71.04819777478602, 0.0]  # Senin GPS verisinden
